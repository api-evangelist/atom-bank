aid: atom-bank
name: Atom Bank
description: 'Atom Bank plc is a UK app-only digital bank headquartered in Newcastle upon Tyne, and the
  first mobile-only bank in the United Kingdom (no branches, no web banking). Authorised by the Prudential
  Regulation Authority and regulated by the Financial Conduct Authority (FS Register 661960), Atom offers
  fixed savings accounts, residential and commercial mortgages, and secured business lending, all delivered
  through its iOS and Android apps. Atom does not publish a public developer API or developer portal; it
  is a consumer of UK Open Banking, letting customers share a one-off snapshot of their bank data (via
  aggregators such as Plaid, Tink and TrueLayer) to speed lending decisions. Backed by Anthemis and others,
  Atom runs a Go/Python/Java/Kafka technology stack and operates a four-day working week.'
